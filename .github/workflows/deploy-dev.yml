name: Hive UI - DEV Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      NEXT_PUBLIC_LD_CLIENT_ID: ${{ secrets.PULSE_LD_CLIENT_ID_DEV }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Change UI version
        run: echo "VERSION=${{github.run_number}}" > public/version.txt
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "pnpm"
      - name: Cache Node Modules
        id: pnpm-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            dev-proxy/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'dev-proxy/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile &&
          cd dev-proxy &&
          npm ci
      - name: Cache Next.js Build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'dev-proxy/package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-
      # - name: Validate i18n keys
      #   run: python3 scripts/validate-i18n.py
      - name: Build and Export Next.js App
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cp .env.dev .env.local &&
          pnpm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: "ap-south-1"
      - name: Upload to S3/Cloudfront
        uses: staevs/s3-deploy-action@v1.2.3
        if: success()
        with:
          args: --follow-symlinks --delete --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEV_S3CLOUDFRONT_USER_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEV_S3CLOUDFRONT_USER_SECRET_KEY }}
          AWS_REGION: "ap-south-1"
          AWS_S3_BUCKET: "pulse-hive-dev.portal26.ai"
          S3_SOURCE_DIR: "dist"
          DESTINATION_DIR: "${{ github.run_number }}"
      - name: Upload to S3/Cloudfront
        uses: staevs/s3-deploy-action@v1.2.3
        if: success()
        with:
          args: --follow-symlinks --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEV_S3CLOUDFRONT_USER_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEV_S3CLOUDFRONT_USER_SECRET_KEY }}
          AWS_REGION: "ap-south-1"
          AWS_S3_BUCKET: "pulse-hive-dev.portal26.ai"
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PULSE_DEV_CLOUDFRONT_DISTRIBUTION_ID }}
          S3_SOURCE_DIR: "dist"
          DESTINATION_DIR: "current"
